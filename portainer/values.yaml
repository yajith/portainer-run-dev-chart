# Default values for portainer.
replicaCount: 1

image:
  repository: portainer/portainer-ce
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: NodePort
  httpPort: 9000
  edgePort: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: portainer.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

livenessProbe:
  httpGet:
    path: /
    port: 9000
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /
    port: 9000
  initialDelaySeconds: 10
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

# Portainer admin password (leave empty to set via UI on first login)
adminPassword: ""
